      (function () {
        // 1. Suppress third-party Chrome extension errors (e.g. chrome-extension:// request interceptors)
        window.addEventListener(
          'error',
          function (e) {
            if (
              (e && e.filename && String(e.filename).indexOf('chrome-extension://') === 0) ||
              (e && e.message && String(e.message).indexOf('Cannot set property fetch') !== -1)
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return false;
            }
          },
          true
        );

        // 2. Helper to ensure a target object's 'fetch' property has both getter and setter
        function ensureWritableFetch(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable !== false) {
              var currentFn = (typeof window.fetch === 'function' ? window.fetch : desc.value) || function () {};
              var getter = desc.get;
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return getter ? getter.call(this) : currentFn;
                },
                set: function (v) {
                  if (typeof v === 'function') {
                    currentFn = v;
                    getter = null;
                  }
                },
              });
            }
          } catch (err) {}
        }

        ensureWritableFetch(window);
        ensureWritableFetch(Window.prototype);

        // 3. Intercept future Object.defineProperty calls on window.fetch that omit a setter
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (
              (obj === window || obj === Window.prototype) &&
              prop === 'fetch' &&
              descriptor &&
              descriptor.get &&
              !descriptor.set
            ) {
              var origGet = descriptor.get;
              var overrideFn = null;
              descriptor = Object.assign({}, descriptor, {
                configurable: true,
                get: function () {
                  return overrideFn || origGet.call(this);
                },
                set: function (v) {
                  if (typeof v === 'function') {
                    overrideFn = v;
                  }
                },
              });
            }
            return origDefineProperty.call(Object, obj, prop, descriptor);
          };
        } catch (err) {}
      })();
    </script>
